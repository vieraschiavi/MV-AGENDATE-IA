<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda — MV Agendate IA</title>
<link rel="icon" href="/logo-mv.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/workspace.css">
</head>
<body>
<div class="mv-pagehead">
  <div><div class="mv-crumb">Espacio de trabajo</div><h1>📅 Agenda</h1></div>
  <div class="mv-views" style="margin-left:auto;">
    <button id="vTabla" class="on" onclick="cambiarVista('tabla')">☰ Tabla</button>
    <button id="vTablero" onclick="cambiarVista('tablero')">▦ Tablero</button>
  </div>
</div>
<div class="mv-content">
  <div class="mv-pagehead" style="background:none;border:0;padding:0 0 14px;flex-wrap:wrap;">
    <input id="fFecha" type="date" style="width:auto;">
    <select id="fOficio" style="width:auto;"><option value="">Oficio</option></select>
    <select id="fEstado" style="width:auto;"><option value="">Estado</option><option>pendiente</option><option>confirmada</option><option>en_curso</option><option>completada</option><option>cancelada</option></select>
    <select id="fProfesional" style="width:auto;display:none;"><option value="">Profesional</option></select>
    <button class="btn cel" id="btnNueva">+ Nueva cita</button>
    <a class="btn sec" href="/api/agenda.csv">⬇ CSV</a>
    <a class="btn sec" href="/api/agenda.xls">⬇ Excel</a>
  </div>
  <div id="vistaTabla"><div class="mv-tablewrap"><div id="lista"></div></div></div>
  <div id="vistaTablero" style="display:none;"><div class="mv-board" id="board"></div></div>
</div>

<div class="modal" id="mForm"><div class="box"><h3>Nueva cita</h3>
  <div class="form2">
    <div><label>Cliente</label><input id="pCliente"></div>
    <div><label>Teléfono</label><input id="pTelefono"></div>
    <div><label>Oficio</label><select id="pOficio"></select></div>
    <div><label>Trabajo</label><select id="pTrabajo"></select></div>
    <div id="pProfesionalBox" style="display:none;"><label>Profesional</label><select id="pProfesional"></select></div>
    <div><label>Fecha</label><input id="pFecha" type="date"></div>
    <div><label>Hora inicio</label><input id="pInicio" type="time"></div>
    <div><label>Hora fin</label><input id="pFin" type="time"></div>
    <div><label>Distancia estimada (km)</label><input id="pDistancia" type="number" value="5"></div>
  </div>
  <label>Dirección</label><input id="pDireccion" style="width:100%;">
  <label>Quién atiende (si no es el titular)</label><input id="pReceptor" style="width:100%;">
  <div id="pCotizacion" style="margin-top:10px;font-size:.85rem;color:var(--muted);"></div>
  <div style="margin-top:12px;"><button class="btn cel" id="btnGuardar">Guardar cita</button> <button class="btn sec" onclick="cerrar('mForm')">Cancelar</button></div>
</div></div>

<script src="/js/workspace.js"></script>
<script>
mvShell('agenda');
const $ = (s) => document.querySelector(s);
const ESTADOS = ['pendiente','confirmada','en_curso','completada','cancelada'];
let citas = [], oficios = [], profesionales = [], vista = 'tabla';
const filtro = () => ({ fecha:$('#fFecha').value, oficio:$('#fOficio').value, estado:$('#fEstado').value, profesionalId:$('#fProfesional').value });
const nombreProf = (id) => profesionales.find(p=>p.id===id)?.nombre || '';

async function cargarOficios() {
  oficios = await (await fetch('/api/oficios')).json();
  const opts = oficios.map(o=>`<option value="${o.clave}">${o.nombre}</option>`).join('');
  $('#fOficio').innerHTML = '<option value="">Oficio</option>' + opts;
  $('#pOficio').innerHTML = opts;
  actualizarTrabajos();
}
async function cargarProfesionales() {
  profesionales = await (await fetch('/api/profesionales')).json();
  if (profesionales.length > 1) {
    const opts = profesionales.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');
    $('#fProfesional').innerHTML = '<option value="">Profesional</option>' + opts;
    $('#fProfesional').style.display = '';
    $('#pProfesional').innerHTML = opts;
    $('#pProfesionalBox').style.display = '';
  }
}
function actualizarTrabajos() {
  const of = oficios.find(o=>o.clave===$('#pOficio').value) || oficios[0];
  $('#pTrabajo').innerHTML = (of?.trabajos||[]).map(t=>`<option value="${t.clave}">${t.nombre}</option>`).join('');
}
$('#pOficio').onchange = actualizarTrabajos;

async function cotizarPreview() {
  const body = { oficio: $('#pOficio').value, trabajo: $('#pTrabajo').value, distanciaKm: Number($('#pDistancia').value)||0 };
  if (!body.oficio || !body.trabajo) return;
  const r = await (await fetch('/api/cotizar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })).json();
  $('#pCotizacion').textContent = r.total != null ? `Presupuesto estimado: $ ${r.total.toLocaleString('es-UY')} (${r.duracion_estimada_min} min)` : '';
}
['pOficio','pTrabajo','pDistancia'].forEach(id=>$('#'+id).addEventListener('change', cotizarPreview));

function selectEstado(c) {
  return `<select onchange="cambiarEstado('${c.id}',this.value)" onclick="event.stopPropagation()" style="font-size:.8rem;padding:4px;">
    <option value="">Cambiar estado…</option>${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select>`;
}

function renderTabla() {
  if (!citas.length) { $('#lista').innerHTML = '<div class="mv-empty">Sin citas con ese filtro.</div>'; return; }
  const colProf = profesionales.length > 1 ? '<th>Profesional</th>' : '';
  $('#lista').innerHTML = `<table class="mv-table"><tr>
      <th>Cliente</th><th>Trabajo</th><th>Oficio</th>${colProf}<th>Fecha</th><th>Hora</th><th>Dirección</th><th>Precio</th><th>Estado</th><th></th>
    </tr>` + citas.map((c) => `<tr class="row" onclick="window.open('/api/citas/${c.id}/ficha','_blank')">
      <td>${c.clienteNombre}</td><td>${c.trabajoNombre}</td><td>${c.oficioNombre}</td>
      ${profesionales.length > 1 ? `<td>${nombreProf(c.profesionalId)||'—'}</td>` : ''}
      <td>${c.fecha}</td><td>${c.inicio}-${c.fin}</td>
      <td>${c.direccion||'—'}${c.receptor?' · atiende '+c.receptor:''}</td>
      <td><strong style="color:var(--cel);">${c.cotizacion?.total ? '$ '+c.cotizacion.total.toLocaleString('es-UY') : '—'}</strong></td>
      <td><span class="pill ${c.estado}"><i></i>${c.estado}</span></td>
      <td onclick="event.stopPropagation()">${selectEstado(c)}</td>
    </tr>`).join('') + '</table>';
}

function renderTablero() {
  $('#board').innerHTML = ESTADOS.map((e) => {
    const cs = citas.filter(c=>c.estado===e);
    return `<div class="mv-board-col"><h3><span class="pill ${e}"><i></i>${e}</span><span class="cnt">${cs.length}</span></h3>` +
      cs.map(c => `<div class="mv-board-card" onclick="window.open('/api/citas/${c.id}/ficha','_blank')">
        <div class="t">${c.clienteNombre}</div>
        <div class="m">${c.trabajoNombre} · ${c.fecha} ${c.inicio}${profesionales.length > 1 ? ' · '+(nombreProf(c.profesionalId)||'—') : ''}</div>
        <div class="m">📍 ${c.direccion||'—'}</div>
        <div class="precio">${c.cotizacion?.total ? '$ '+c.cotizacion.total.toLocaleString('es-UY') : '—'}</div>
      </div>`).join('') + (cs.length ? '' : '<div class="mv-empty" style="padding:8px;">Vacío</div>') + '</div>';
  }).join('');
}

function cambiarVista(v) {
  vista = v;
  $('#vTabla').classList.toggle('on', v==='tabla');
  $('#vTablero').classList.toggle('on', v==='tablero');
  $('#vistaTabla').style.display = v==='tabla' ? '' : 'none';
  $('#vistaTablero').style.display = v==='tablero' ? '' : 'none';
}

async function cargar() {
  const q = new URLSearchParams(Object.entries(filtro()).filter(([,v])=>v));
  citas = await (await fetch('/api/citas?'+q)).json();
  renderTabla();
  renderTablero();
}
['#fFecha','#fOficio','#fEstado','#fProfesional'].forEach(s=>$(s).onchange=cargar);
const abrir=(m)=>$('#'+m).style.display='grid'; const cerrar=(m)=>$('#'+m).style.display='none';

async function cambiarEstado(id,est){ if(!est) return; await mvFetchAdmin(`/api/citas/${id}/estado`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:est})}); cargar(); }

$('#btnNueva').onclick=()=>{ document.querySelectorAll('#mForm input').forEach(e=>e.value=''); $('#pDistancia').value=5; abrir('mForm'); cotizarPreview(); };
$('#btnGuardar').onclick=async()=>{
  const cot = await (await fetch('/api/cotizar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ oficio:$('#pOficio').value, trabajo:$('#pTrabajo').value, distanciaKm: Number($('#pDistancia').value)||0 }) })).json();
  const of = oficios.find(o=>o.clave===$('#pOficio').value);
  const trabajo = of?.trabajos.find(t=>t.clave===$('#pTrabajo').value);
  const body = {
    clienteNombre: $('#pCliente').value, telefono: $('#pTelefono').value,
    profesionalId: $('#pProfesional').value || undefined,
    oficio: $('#pOficio').value, oficioNombre: of?.nombre, trabajo: $('#pTrabajo').value, trabajoNombre: trabajo?.nombre,
    fecha: $('#pFecha').value, inicio: $('#pInicio').value, fin: $('#pFin').value || $('#pInicio').value,
    direccion: $('#pDireccion').value, receptor: $('#pReceptor').value || null,
    cotizacion: cot.total != null ? { mano_obra: cot.desglose.mano_obra, materiales: cot.desglose.materiales, traslado: cot.desglose.traslado, total: cot.total } : null
  };
  if(!body.clienteNombre || !body.fecha || !body.inicio) return alert('Completá al menos cliente, fecha y hora.');
  const r=await (await mvFetchAdmin('/api/citas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  if(r.ok){ cerrar('mForm'); cargar(); } else alert(r.error||'Error');
};
Promise.all([cargarOficios(), cargarProfesionales()]).then(cargar);
</script>
<script src="/js/contacto.js" defer></script>
</body>
</html>
