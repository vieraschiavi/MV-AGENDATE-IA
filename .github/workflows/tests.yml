# Corre la suite de tests y el linter en cada push y en cada pull request.
# Si algo se rompe, el job falla y el PR queda en rojo.
#
# OJO — este workflow está escrito y es correcto, pero HOY NO PUEDE CORRER:
# GitHub Actions está bloqueado a nivel de la cuenta. Los jobs terminan en
# "failure" a los ~10 segundos, con runner_id 0 y sin ningún log (la API
# devuelve 404 al pedirlos), o sea que nunca se les asigna una máquina. Le
# pasa igual a este job en ubuntu-latest y a build-windows-exe.yml en
# windows-latest, así que no es cosa del sistema operativo del runner.
# Se destraba desde GitHub → Settings → Billing (método de pago / límite de
# gasto). Hasta entonces, la verificación hay que correrla a mano:
#   npm ci && npm run lint && npm test
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instalación limpia y reproducible desde package-lock.json.
      # ELECTRON_SKIP_BINARY_DOWNLOAD: electron/electron-builder son sólo para
      # empaquetar el instalador de escritorio; los tests no los usan y bajar
      # ~100 MB de Chromium acá sería tiempo tirado.
      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Linter
        run: npm run lint

      - name: Tests
        run: npm test
