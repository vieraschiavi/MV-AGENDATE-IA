# Arma el INSTALADOR de escritorio (electron-builder, target NSIS) para
# Windows en una máquina Windows real de GitHub Actions — sin Wine, sin que
# nadie corra nada a mano — y lo publica como asset de un Release fijo
# ("desktop-windows-latest"). El resultado es un único MV-Agendate-IA-Setup.exe
# que instala la app (accesos directos, desinstalador, sin pedir permisos de
# administrador) con un solo doble clic — no un ZIP para descomprimir.
#
# La web de venta apunta siempre a la misma URL estable:
#   https://github.com/<owner>/<repo>/releases/latest/download/MV-Agendate-IA-Setup.exe
# (configurada una sola vez en Vercel como DESCARGA_EXE_URL) — GitHub resuelve
# ese link al asset del release más reciente automáticamente, así que no hay
# que tocar nada en Vercel cada vez que se genera un build nuevo.
name: Build Windows desktop app

on:
  push:
    branches: [main]
    # Solo lo que de verdad entra en el instalador (ver package.json → build.files):
    # src/, electron/, public/ (sin video ni descargas, excluidos del paquete),
    # los assets del asistente (build/) y las deps. api/ es solo serverless de
    # Vercel y NO se empaqueta. Los propios exes committeados (public/descargas/,
    # INSTALADOR/) tampoco disparan — INSTALADOR/ ni figura en la lista, así el
    # commit que este mismo workflow hace al final no re-dispara el build.
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - '!public/video/**'
      - '!public/descargas/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# Dos builds en paralelo se pisan en el `git pull --rebase` del último paso
# (chocan en los .exe, que son binarios y no se pueden mergear) y dejan el job
# rojo con el release ya publicado. Se encolan: siempre gana el commit más nuevo.
concurrency:
  group: build-windows-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Las tres variantes del instalador (cada "pre" regenera dist-protegido/
      # con la config de su variante, por eso van en serie y no en paralelo).
      - run: npm run empaquetar-exe
      - run: npm run empaquetar-exe-demo
      - run: npm run empaquetar-exe-owner

      # Y las mismas tres en versión PORTABLE (.zip con lanzador .bat, sin
      # instalador): es la alternativa para los clientes cuya empresa no deja
      # abrir ejecutables. Van después de los exes porque comparten
      # dist-protegido/ y cada una lo regenera con los días de SU variante.
      - name: Paquetes portables (.bat) de las tres variantes
        shell: bash
        run: npm run empaquetar-pc-todos

      - name: Publicar release (siempre "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-windows-latest
          name: MV Agendate IA — Windows (build automático)
          make_latest: true
          body: Generado automáticamente por GitHub Actions desde el último commit de `main`. No editar a mano — se reemplaza en cada build.
          # OJO: acá van SOLO las variantes vendibles/públicas. La variante del
          # dueño (sin límite de prueba) NUNCA se publica en el release: vive
          # committeada en INSTALADOR/OWNER/ del repo privado (paso siguiente).
          # No se sube como artifact porque el storage de Actions tiene cupo
          # y ya reventó una vez.
          files: |
            dist-instalador/MV-Agendate-IA-Setup.exe
            dist-instalador/MV-Agendate-IA-Setup-Demo.exe
            public/descargas/MV-Agendate-IA-PC.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deja lo recién buildeado committeado en INSTALADOR/ para que el ZIP del
      # repo (Code → Download ZIP) siempre traiga las entregas al día. De cada
      # variante van las DOS formas: el instalador .exe y el paquete portable
      # .zip con lanzador .bat (los .zip ya los dejó en su carpeta el paso
      # anterior, por eso acá solo se copian los exes).
      #   CLIENTE/ → oficial + demo, .exe y .zip
      #   OWNER/   → la del dueño, sin límite de prueba, que nunca va al release
      # El push solo toca INSTALADOR/, que no está en los paths de arriba — no
      # re-dispara esto.
      #
      # También refresca public/descargas/: el botón "Descargar para PC" de
      # /instalar.html apunta al archivo estático de esa carpeta, y src/server.js
      # lo sirve ANTES de caer al release. Si no se actualiza acá, la web sigue
      # entregando el exe viejo (p.ej. con la prueba de días anterior) por más
      # que el release esté al día. public/descargas/** está excluido de los
      # paths de arriba, así que este commit tampoco re-dispara el build.
      - name: Actualizar entregas del repo (INSTALADOR/ + web)
        shell: bash
        run: |
          # GitHub rechaza archivos de 100 MiB o más. Los exes rondan los 97,5
          # MiB: si uno cruza el límite, el push falla DESPUÉS de publicar el
          # release y la web se queda sirviendo el instalador viejo sin que
          # nadie se entere. Mejor cortar acá, con el motivo escrito.
          LIMITE=$((100 * 1024 * 1024))
          for exe in dist-instalador/*.exe; do
            peso=$(stat -c%s "$exe")
            echo "$exe → $((peso / 1024 / 1024)) MiB"
            if [ "$peso" -ge "$LIMITE" ]; then
              echo "::error::$exe pesa $peso bytes y GitHub no acepta archivos de 100 MiB o más. Hay que sacar los exes del repo (release o Git LFS) antes de seguir commiteándolos."
              exit 1
            fi
          done
          mkdir -p INSTALADOR/CLIENTE INSTALADOR/OWNER public/descargas
          cp dist-instalador/MV-Agendate-IA-Setup.exe      INSTALADOR/CLIENTE/
          cp dist-instalador/MV-Agendate-IA-Setup-Demo.exe INSTALADOR/CLIENTE/
          cp dist-instalador/MV-Agendate-IA-Setup-Dueno.exe INSTALADOR/OWNER/
          cp dist-instalador/MV-Agendate-IA-Setup.exe      public/descargas/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTALADOR public/descargas
          if git diff --cached --quiet; then
            echo "Los instaladores ya estaban al día — nada que commitear."
            exit 0
          fi
          git commit -m "Actualizar instaladores con los exes del build ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
