<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — MV Agendate IA</title>
<link rel="icon" href="/logo-mv.svg" type="image/svg+xml">
<style>
  :root { --azul:#0f2a43; --cel:#1f7ae0; --oro:#e3a72f; --gris:#f4f6f9; }
  * { margin:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
  body { background:var(--gris); color:#22303e; }
  header { background:var(--azul); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  header a { color:var(--oro); text-decoration:none; font-weight:600; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media (max-width:860px){ main{grid-template-columns:1fr;} }
  .col { background:#fff; border-radius:14px; box-shadow:0 4px 18px #0001; overflow:hidden; display:flex; flex-direction:column; }
  .col h2 { background:var(--azul); color:#fff; font-size:1.05rem; padding:14px 18px; }
  /* Chat */
  #mensajes { flex:1; min-height:380px; max-height:520px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; font-size:.95rem; line-height:1.45; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--cel); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--gris); border-bottom-left-radius:4px; }
  form.chat { display:flex; gap:8px; padding:12px; border-top:1px solid #e4e9ef; }
  form.chat input { flex:1; padding:12px 14px; border:1px solid #cfd8e0; border-radius:10px; font-size:1rem; }
  button { background:var(--cel); color:#fff; border:0; border-radius:10px; padding:12px 20px; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  .chips { padding:0 16px 12px; display:flex; flex-wrap:wrap; gap:8px; }
  .chips span { background:#e8f0fb; color:var(--cel); border-radius:20px; padding:6px 12px; font-size:.82rem; cursor:pointer; }
  /* Cotizador */
  .cot { padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cot label { font-size:.82rem; font-weight:600; color:#54626f; display:block; margin-bottom:4px; }
  .cot input, .cot select { width:100%; padding:10px; border:1px solid #cfd8e0; border-radius:8px; font-size:.95rem; }
  .cot .full { grid-column:1/-1; }
  #resultado { margin:0 18px 18px; padding:16px; border-radius:10px; background:var(--gris); display:none; }
  #resultado .rango { font-size:1.5rem; font-weight:800; color:var(--azul); }
  #resultado small { color:#5a6b7c; display:block; margin-top:6px; }
  #horarios { padding:0 18px 18px; }
  .horario { background:#e8f0fb; border-radius:10px; padding:10px 12px; margin-top:8px; font-size:.88rem; }
  /* En el celular, inputs a 16px (evita el zoom automático de iOS al enfocar). */
  @media (max-width:640px){ .cot input, .cot select, form.chat input { font-size:16px; } }
</style>
</head>
<body>

<header>
  <span style="display:flex;align-items:center;gap:10px;"><img src="/logo-mv.svg" alt="MV" style="width:34px;height:34px;border-radius:8px;"><strong id="hTitulo">MV Agendate IA — Demo en vivo</strong></span>
  <span style="display:flex;align-items:center;gap:12px;">
    <select id="selIdioma" aria-label="Idioma / Idioma" style="padding:6px 8px;border-radius:8px;border:1px solid #cbd5e1;font-size:15px;">
      <option value="es">🇺🇾 Español</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <a id="hVolver" href="/">← Volver</a>
  </span>
</header>

<main>
  <div class="col">
    <h2 id="hChat">💬 Hablá con el asistente del profesional</h2>
    <div id="mensajes"></div>
    <div class="chips" id="chips">
      <span onclick="sugerir(this)">¿Cuánto sale instalar un tomacorriente?</span>
      <span onclick="sugerir(this)">Necesito un electricista para mañana</span>
      <span onclick="sugerir(this)">¿Tenés horarios esta semana?</span>
    </div>
    <form class="chat" id="formChat">
      <input id="entrada" placeholder="Escribí tu mensaje..." autocomplete="off" />
      <button type="submit" id="btnEnviar">Enviar</button>
    </form>
  </div>

  <div class="col">
    <h2 id="hCot">💰 Cotizador instantáneo</h2>
    <form class="cot" id="formCot">
      <div><label id="lOficio">Oficio</label><select name="oficio" id="selOficio"></select></div>
      <div><label id="lTrabajo">Trabajo</label><select name="trabajo" id="selTrabajo"></select></div>
      <div><label id="lDistancia">Distancia estimada (km)</label><input name="distanciaKm" type="number" value="5" /></div>
      <div><label id="lUrgencia">Urgencia</label><select name="urgencia"><option value="normal">Normal (agendado)</option><option value="mismo_dia">Mismo día</option><option value="urgente">Urgente</option></select></div>
      <div class="full"><label id="lHorario">Horario</label><select name="horario"><option value="habil">Horario hábil</option><option value="nocturno">Nocturno (después de 20h)</option><option value="feriado">Feriado</option></select></div>
      <div class="full"><button type="submit" id="btnCotizar" style="width:100%;">Cotizar</button></div>
    </form>
    <div id="resultado"></div>
    <div id="horarios"></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let sessionId = null;

// --- Multiidioma es/pt (la web y la demo entienden ambos, igual que el chatbot) ---
const I18N = {
  es: {
    titulo: 'MV Agendate IA — Demo en vivo', volver: '← Volver',
    chat: '💬 Hablá con el asistente del profesional', cot: '💰 Cotizador instantáneo',
    oficio: 'Oficio', trabajo: 'Trabajo', distancia: 'Distancia estimada (km)',
    urgencia: 'Urgencia', horario: 'Horario', cotizar: 'Cotizar', enviar: 'Enviar',
    placeholder: 'Escribí tu mensaje...', escribiendo: 'Escribiendo…',
    saludo: '¡Hola! Soy el asistente virtual del profesional 👋 Contame qué necesitás y te paso presupuesto y horarios disponibles.',
    errconn: 'No pude conectar con el servidor.',
    chips: ['¿Cuánto sale instalar un tomacorriente?', 'Necesito un electricista para mañana', '¿Tenés horarios esta semana?'],
    duracion: 'Duración estimada', minutos: 'minutos', propuestos: 'Horarios propuestos para mañana:', traslado: 'traslado',
    labMano: 'Mano de obra', labMat: 'Materiales', labTras: 'Traslado', labHon: 'Honorarios',
    urg: { normal: 'Normal (agendado)', mismo_dia: 'Mismo día', urgente: 'Urgente' },
    hor: { habil: 'Horario hábil', nocturno: 'Nocturno (después de 20h)', feriado: 'Feriado' }
  },
  pt: {
    titulo: 'MV Agendate IA — Demo ao vivo', volver: '← Voltar',
    chat: '💬 Fale com o assistente do profissional', cot: '💰 Orçamento instantâneo',
    oficio: 'Profissão', trabajo: 'Serviço', distancia: 'Distância estimada (km)',
    urgencia: 'Urgência', horario: 'Horário', cotizar: 'Orçar', enviar: 'Enviar',
    placeholder: 'Escreva sua mensagem...', escribiendo: 'Escrevendo…',
    saludo: 'Olá! Sou o assistente virtual do profissional 👋 Me conte o que você precisa e te passo orçamento e horários disponíveis.',
    errconn: 'Não consegui conectar ao servidor.',
    chips: ['Quanto custa instalar uma tomada?', 'Preciso de um eletricista para amanhã', 'Tem horários esta semana?'],
    duracion: 'Duração estimada', minutos: 'minutos', propuestos: 'Horários propostos para amanhã:', traslado: 'deslocamento',
    labMano: 'Mão de obra', labMat: 'Materiais', labTras: 'Deslocamento', labHon: 'Honorários',
    urg: { normal: 'Normal (agendado)', mismo_dia: 'Mesmo dia', urgente: 'Urgente' },
    hor: { habil: 'Horário comercial', nocturno: 'Noturno (após 20h)', feriado: 'Feriado' }
  },
  en: {
    titulo: 'MV Agendate IA — Live demo', volver: '← Back',
    chat: '💬 Chat with the pro\'s assistant', cot: '💰 Instant quoter',
    oficio: 'Trade', trabajo: 'Job', distancia: 'Estimated distance (km)',
    urgencia: 'Urgency', horario: 'Time', cotizar: 'Quote', enviar: 'Send',
    placeholder: 'Type your message...', escribiendo: 'Typing…',
    saludo: 'Hi! I\'m the professional\'s virtual assistant 👋 Tell me what you need and I\'ll give you a quote and available times.',
    errconn: 'Could not connect to the server.',
    chips: ['How much to install an outlet?', 'I need an electrician for tomorrow', 'Any slots this week?'],
    duracion: 'Estimated duration', minutos: 'minutes', propuestos: 'Proposed times for tomorrow:', traslado: 'travel',
    labMano: 'Labor', labMat: 'Materials', labTras: 'Travel', labHon: 'Fee',
    urg: { normal: 'Normal (scheduled)', mismo_dia: 'Same day', urgente: 'Urgent' },
    hor: { habil: 'Business hours', nocturno: 'After hours (after 8pm)', feriado: 'Holiday' }
  }
};
let idioma = localStorage.getItem('mvIdioma')
  || (() => { const n = (navigator.language || '').toLowerCase(); return n.startsWith('pt') ? 'pt' : n.startsWith('en') ? 'en' : 'es'; })();
if (!I18N[idioma]) idioma = 'es';
const T = () => I18N[idioma];

function aplicarIdioma() {
  const t = T();
  document.documentElement.lang = idioma === 'pt' ? 'pt-BR' : idioma === 'en' ? 'en' : 'es';
  $('#hTitulo').textContent = t.titulo;
  $('#hVolver').textContent = t.volver;
  $('#hChat').textContent = t.chat;
  $('#hCot').textContent = t.cot;
  $('#lOficio').textContent = t.oficio;
  $('#lTrabajo').textContent = t.trabajo;
  $('#lDistancia').textContent = t.distancia;
  $('#lUrgencia').textContent = t.urgencia;
  $('#lHorario').textContent = t.horario;
  $('#btnCotizar').textContent = t.cotizar;
  $('#btnEnviar').textContent = t.enviar;
  $('#entrada').placeholder = t.placeholder;
  const chips = document.querySelectorAll('#chips span');
  t.chips.forEach((c, i) => { if (chips[i]) chips[i].textContent = c; });
  // Opciones de los select de urgencia y horario (traducidas por valor)
  document.querySelectorAll('select[name="urgencia"] option').forEach((o) => { if (t.urg && t.urg[o.value]) o.textContent = t.urg[o.value]; });
  document.querySelectorAll('select[name="horario"] option').forEach((o) => { if (t.hor && t.hor[o.value]) o.textContent = t.hor[o.value]; });
  $('#selIdioma').value = idioma;
}

function agregar(texto, quien) {
  const div = document.createElement('div');
  div.className = 'msg ' + quien;
  div.textContent = texto;
  $('#mensajes').appendChild(div);
  $('#mensajes').scrollTop = $('#mensajes').scrollHeight;
  return div;
}

aplicarIdioma();
agregar(T().saludo, 'bot');

$('#selIdioma').addEventListener('change', (e) => {
  idioma = I18N[e.target.value] ? e.target.value : 'es';
  localStorage.setItem('mvIdioma', idioma);
  aplicarIdioma();
  // Reiniciamos la charla para que el saludo y el hilo queden en el nuevo idioma.
  sessionId = null;
  $('#mensajes').innerHTML = '';
  agregar(T().saludo, 'bot');
});

function sugerir(el) { $('#entrada').value = el.textContent; $('#formChat').requestSubmit(); }

$('#formChat').addEventListener('submit', async (e) => {
  e.preventDefault();
  const texto = $('#entrada').value.trim();
  if (!texto) return;
  agregar(texto, 'user');
  $('#entrada').value = '';
  $('#btnEnviar').disabled = true;
  const pensando = agregar(T().escribiendo, 'bot');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: texto, sessionId, idioma })
    });
    const data = await r.json();
    sessionId = data.sessionId || sessionId;
    pensando.textContent = data.respuesta || data.error || 'Error inesperado.';
  } catch {
    pensando.textContent = T().errconn;
  } finally {
    $('#btnEnviar').disabled = false;
    $('#entrada').focus();
  }
});

// ---------- Cotizador ----------
let oficios = [];
async function cargarOficios() {
  oficios = await (await fetch('/api/oficios')).json();
  $('#selOficio').innerHTML = oficios.map(o => `<option value="${o.clave}">${o.nombre}</option>`).join('');
  actualizarTrabajos();
}
function actualizarTrabajos() {
  const of = oficios.find(o => o.clave === $('#selOficio').value) || oficios[0];
  $('#selTrabajo').innerHTML = (of?.trabajos || []).map(t => `<option value="${t.clave}">${t.nombre}</option>`).join('');
}
$('#selOficio').addEventListener('change', actualizarTrabajos);
cargarOficios();

$('#formCot').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  body.distanciaKm = Number(body.distanciaKm) || 0;
  const r = await fetch('/api/cotizar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  const caja = $('#resultado');
  caja.style.display = 'block';
  if (d.error) { caja.innerHTML = '⚠️ ' + d.error; return; }
  const sim = d.simbolo || '$';
  const etiqueta = d.tipo_cobro === 'honorarios' ? T().labHon : T().labMano;
  caja.innerHTML =
    '<div class="rango">' + sim + ' ' + d.total.toLocaleString(idioma === 'pt' ? 'pt-BR' : idioma === 'en' ? 'en-US' : 'es-UY') + ' <span style="font-size:.9rem;color:#5a6b7c;">' + (d.moneda || '') + '</span></div>' +
    T().duracion + ': <strong>' + d.duracion_estimada_min + ' ' + T().minutos + '</strong>' +
    '<small>' + etiqueta + ': ' + sim + d.desglose.mano_obra +
      (d.tipo_cobro === 'honorarios' && !d.desglose.materiales ? '' : ' · ' + T().labMat + ': ' + sim + d.desglose.materiales) +
      ' · ' + T().labTras + ': ' + sim + d.desglose.traslado + '</small>' +
    '<small>' + d.trabajo + ' (' + d.oficio + ')</small>';

  // Horarios de ejemplo, para mostrar el motor de agenda con traslados.
  const hoy = new Date();
  const manana = new Date(hoy.getTime() + 86400000);
  const propuestos = await (await fetch('/api/agenda/proponer', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      fecha: manana.toISOString().slice(0, 10), diaSemana: manana.getDay(),
      ubicacionCliente: { lat: -34.90 + Math.random() * 0.03, lng: -56.16 + Math.random() * 0.03 },
      duracionMin: d.duracion_estimada_min,
      citasDelDia: [{ inicio: '09:00', fin: '10:00', ubicacion: { lat: -34.91, lng: -56.15 } }]
    })
  })).json();
  $('#horarios').innerHTML = propuestos.propuestas?.length
    ? '<strong>' + T().propuestos + '</strong>' + propuestos.propuestas.map(p => `<div class="horario">🕐 ${p.inicio} - ${p.fin} (${T().traslado}: ${p.traslado_previo_min + p.traslado_posterior_min} min)</div>`).join('')
    : (propuestos.motivo_descarte ? `<div class="horario">${propuestos.motivo_descarte}</div>` : '');
});
</script>
<script type="module" src="/js/botid-init.js"></script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
