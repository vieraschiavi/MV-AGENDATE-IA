<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Licencia y EULA — MV Agendate IA</title>
<link rel="icon" href="/logo-mv.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
  :root{
    --fondo:#070d15; --fondo2:#0b1520; --tinta:#eaf2fa; --sub:#8fa6ba;
    --cel:#2f9dff; --line:rgba(143,166,186,.16); --card:rgba(17,30,45,.65);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--fondo); color:var(--tinta); line-height:1.7; }
  a{ color:var(--cel); }
  .wrap{ max-width:760px; margin:0 auto; padding:60px 6% 100px; }
  .volver{ display:inline-block; margin-bottom:28px; font-size:.9rem; }
  h1{ font-size:1.8rem; margin-bottom:6px; }
  .sub{ color:var(--sub); font-size:.9rem; margin-bottom:32px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 30px; white-space:pre-wrap; font-size:.92rem; }
  h2{ font-size:1.05rem; margin:26px 0 8px; color:var(--cel); }
</style>
</head>
<body>
<div class="wrap">
  <a class="volver" href="/">← Volver a MV Agendate IA</a>
  <h1>Licencia y Acuerdo de Usuario Final</h1>
  <div class="sub">Aplica a la versión SaaS online y a la versión descargable (Windows / Android) de MV Agendate IA.</div>
  <div class="card" id="texto">Cargando…</div>
</div>
<script>
  fetch('/legales/eula.txt').then(r => r.text()).then(t => {
    document.getElementById('texto').textContent = t;
  }).catch(() => {
    document.getElementById('texto').textContent = 'No se pudo cargar el texto. Escribinos si necesitás una copia.';
  });
</script>
</body>
</html>
