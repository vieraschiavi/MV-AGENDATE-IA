<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20456b"/>
      <stop offset="1" stop-color="#0e2740"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="1008" height="1008" rx="232" fill="url(#bg)"/>
  <!-- M (blanco) — letra independiente, sin tocar la V -->
  <polyline points="87,700 87,360 297,590 507,360 507,700"
    fill="none" stroke="#ffffff" stroke-width="94" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- V (verde) — letra independiente, separada de la M por un espacio real.
       El tope sube unas unidades respecto de la M: al ser un ángulo interno
       (miter) en la M y una punta abierta (butt) en la V, a igual coordenada
       Y la M "pincha" más arriba que la V; se compensa acá para que ambas
       queden alineadas arriba de verdad. -->
  <polyline points="637,264 787,700 937,264"
    fill="none" stroke="#5cb531" stroke-width="103" stroke-linejoin="miter" stroke-linecap="butt"/>
</svg>
