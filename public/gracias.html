<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias! — MV Agendate IA</title>
<link rel="icon" href="/logo-mv.svg" type="image/svg+xml">
<style>
  :root{ --navy:#0f2a43; --navy2:#16466e; --cel:#1f7ae0; --oro:#e0b25c; --line:#e6ebf1; --ok:#1a7f37; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#eef2f7; color:#1e2b38; }
  header{ background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:12px; }
  header img{ width:36px; height:36px; border-radius:9px; } header strong{ font-size:1.05rem; } header a{ margin-left:auto; color:#e0b25c; text-decoration:none; }
  .wrap{ max-width:560px; margin:40px auto; padding:0 16px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:30px; box-shadow:0 10px 32px #0f2a4314; text-align:center; }
  .ico{ font-size:3rem; margin-bottom:6px; }
  h1{ color:var(--navy); font-size:1.5rem; margin:6px 0 4px; }
  .lead{ color:#5a6b7c; font-size:.95rem; margin-bottom:20px; }
  .resumen{ background:#f6f9fc; border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-align:left; font-size:.9rem; margin-bottom:18px; }
  .resumen .row{ display:flex; justify-content:space-between; padding:5px 0; }
  .resumen .row b{ color:var(--navy); }
  .estado{ padding:16px; border-radius:12px; margin-bottom:16px; }
  .pend{ background:#fff8e8; border:1px solid #f0d38a; color:#8a5a00; }
  .ok{ background:#e9f7ee; border:1px solid #bfe3c8; color:var(--ok); }
  .spin{ display:inline-block; width:16px; height:16px; border:2px solid #f0d38a; border-top-color:#8a5a00; border-radius:50%; animation:sp 0.8s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .btn{ display:inline-block; background:var(--cel); color:#fff; border:0; border-radius:11px; padding:14px 22px; font-weight:700; font-size:1rem; text-decoration:none; margin-top:6px; }
  code{ background:#eef2f7; padding:1px 6px; border-radius:4px; }
  .box{ background:#f6f9fc; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:.85rem; margin-top:10px; text-align:left; }
  a.volver{ color:var(--cel); text-decoration:none; font-size:.88rem; }
</style>
</head>
<body>
<header><img src="/logo-mv.svg" alt="MV"><strong>MV Agendate IA</strong><a href="/">Inicio</a></header>
<div class="wrap">
  <div class="card">
    <div class="ico">🎉</div>
    <h1>¡Gracias por tu compra!</h1>
    <p class="lead">Pedido <code id="idPedido">—</code></p>

    <div class="resumen" id="resumen" style="display:none;">
      <div class="row"><span>Plan</span><b id="rPlan">—</b></div>
      <div class="row"><span>Versión</span><b id="rVer">—</b></div>
      <div class="row"><span>Total</span><b id="rTot">—</b></div>
    </div>

    <div id="estadoBox"></div>

    <p style="margin-top:18px;"><a class="volver" href="/comprar.html">← Volver a la tienda</a></p>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const VERNOMBRE = { pc: '💻 PC / Servidor', apk: '📱 Android (APK)', ios: '🍏 iOS', todas: '📦 Todas las versiones' };
const id = new URLSearchParams(location.search).get('pedido');
$('#idPedido').textContent = id || '—';
if (!id) {
  $('#estadoBox').innerHTML = '<div class="estado pend">No encontré tu pedido. Si venís de pagar, esperá unos segundos y recargá, o contactanos.</div>';
} else {
  poll();
}
async function poll() {
  let d;
  try { d = await (await fetch('/api/pedido/' + encodeURIComponent(id))).json(); }
  catch { $('#estadoBox').innerHTML = '<div class="estado pend">No pude conectar con el servidor. Reintentando…</div>'; return setTimeout(poll, 4000); }
  if (!d.ok) { $('#estadoBox').innerHTML = '<div class="estado pend">No encontré ese pedido. Verificá el link o contactanos.</div>'; return; }

  $('#resumen').style.display = 'block';
  $('#rPlan').textContent = d.planNombre || d.plan || '—';
  $('#rVer').textContent = VERNOMBRE[d.version] || d.version || '—';
  $('#rTot').textContent = d.total_usd ? ('USD ' + d.total_usd) : '—';

  if (d.estado === 'pagado' && d.token) {
    $('#estadoBox').innerHTML =
      '<div class="estado ok"><strong>✅ Pago confirmado</strong><br>Licencia: <code>' + d.licencia + '</code></div>' +
      '<a class="btn" href="/descargar/' + d.token + '">⬇ Descargar ' + (VERNOMBRE[d.version] || 'el software') + '</a>' +
      '<div class="box">Guardá tu licencia — la vas a necesitar la primera vez que abras el programa. Si perdés el link de descarga, volvé a esta página con tu N° de pedido (<code>' + id + '</code>).</div>';
  } else {
    $('#estadoBox').innerHTML =
      '<div class="estado pend"><span class="spin"></span><strong>Confirmando tu pago con MercadoPago…</strong><br>Apenas MercadoPago confirme, esta página se actualiza sola con tu licencia y la descarga. Podés cerrarla y volver con tu N° de pedido (<code>' + id + '</code>).</div>';
    setTimeout(poll, 4000);
  }
}
</script>
</body>
</html>
